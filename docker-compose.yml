services:
  Compare-Backend:
    container_name: Compare-Backend
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    image: compare_backend_dev

    ports:
      - "8080:80"
    volumes:
      - .:/app/
    depends_on:
      - db
    command: /bin/bash -c "./prestart.sh && uvicorn src.core.main:app --host 0.0.0.0 --port 80 --reload"

  db:
    container_name: postgresql_db
    image: postgres:16

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - 8081:80

volumes:
  postgres_data: